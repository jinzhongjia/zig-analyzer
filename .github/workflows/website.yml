name: Website

# Deploys website/ to zig-analyzer.dev as configured in wrangler.jsonc. The site has no build step.
# Pull requests that change it run a dry run, which needs no credentials. Pushes to main deploy with
# the repository secrets CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" template) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - wrangler.jsonc
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - wrangler.jsonc
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_VERSION: 4.164.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Check' || 'Deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Dry run
        if: github.event_name == 'pull_request'
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run
      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --message "${GITHUB_SHA::7}"
