name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: 单元测试（Debug）
        run: zig build test --summary all
      - name: 单元测试（ReleaseSafe）
        run: zig build test -Doptimize=ReleaseSafe --summary all
      - name: 构建可执行文件
        run: zig build -Doptimize=ReleaseSafe
      - name: 语料对拍（Zig 标准库 + 本仓库源码）
        run: zig build corpus -Doptimize=ReleaseSafe -- src tools

  lint:
    name: 格式与生成代码
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        run: zig fmt --check src tools build.zig
      - name: 生成代码与提交一致
        run: |
          zig build gen
          git diff --exit-code -- src/lsp/types.zig

  fuzz:
    name: 覆盖率引导模糊测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # 使用 ReleaseSafe：Linux x86_64 的 Debug 构建默认走自研后端，不支持覆盖率插桩
      # （覆盖率文件 pcs_len 为 0）；ReleaseSafe 走 LLVM，吞吐量也更高。每个模糊目标 5 万次。
      - name: zig build test --fuzz
        run: zig build test -Doptimize=ReleaseSafe --fuzz=50K
