name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: 全部测试（Debug）
        run: zig build test-all --summary all
      - name: 全部测试（ReleaseSafe）
        run: zig build test-all -Doptimize=ReleaseSafe --summary all
      - name: 构建可执行文件
        run: zig build -Doptimize=ReleaseSafe
      - name: 编译检查（含基准工具）
        run: zig build check -Doptimize=ReleaseSafe
      - name: 语料对拍（Zig 标准库 + 本仓库源码）
        run: zig build corpus -Doptimize=ReleaseSafe -- src tools

  lint:
    name: 格式与生成代码
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        run: zig fmt --check src tools build.zig
      - name: 生成代码与提交一致
        run: |
          zig build gen
          git diff --exit-code -- src/lsp/types.zig src/ide/builtin_data.zig

  fuzz:
    name: 覆盖率引导模糊测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Use ReleaseSafe: Debug builds on Linux x86_64 use the self-hosted backend by default, which
      # does not support coverage instrumentation (pcs_len in the coverage file is 0); ReleaseSafe
      # uses LLVM and also has higher throughput. 50K runs per fuzz target.
      - name: zig build test --fuzz
        run: zig build test -Doptimize=ReleaseSafe --fuzz=50K
