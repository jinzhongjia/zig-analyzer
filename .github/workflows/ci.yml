name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs it on the tagged commit before building the release
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.1

jobs:
  # A pull request runs the jobs of the paths it changes, and the fast subset of the Zig matrix; a
  # push to main and a release run every job and every matrix entry, so that changes that pass one
  # at a time still meet each other in CI
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      zig: ${{ steps.detect.outputs.zig }}
      vscode: ${{ steps.detect.outputs.vscode }}
      zed: ${{ steps.detect.outputs.zed }}
      nvim: ${{ steps.detect.outputs.nvim }}
      vim: ${{ steps.detect.outputs.vim }}
      updates: ${{ steps.detect.outputs.updates }}
      emacs: ${{ steps.detect.outputs.emacs }}
      test-matrix: ${{ steps.detect.outputs.test-matrix }}
      build-matrix: ${{ steps.detect.outputs.build-matrix }}
      corpus-matrix: ${{ steps.detect.outputs.corpus-matrix }}
      fuzz-runs: ${{ steps.detect.outputs.fuzz-runs }}
    steps:
      # The three-dot diff of a pull request needs the base commit and the merge base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Detect the changed paths
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          zig=false vscode=false zed=false nvim=false vim=false updates=false emacs=false full=false
          all() { zig=true vscode=true zed=true nvim=true vim=true updates=true emacs=true; }

          if [ "$EVENT" != pull_request ]; then
            full=true
            all
          else
            if [ -z "$BASE" ]; then
              echo "::error::a pull request without a base commit"
              exit 1
            fi
            # A file, not a pipe: a failed diff must fail the job instead of reading no paths
            changed="$RUNNER_TEMP/changed-paths"
            git diff --no-renames --name-only -z "$BASE...$HEAD" > "$changed"
            while IFS= read -r -d '' path; do
              case "$path" in
                # A change to CI itself is tested by running all of it
                .github/workflows/ci.yml) all; full=true ;;
                # The VS Code extension checks its settings against the server's settings table
                src/Config.zig) zig=true; vscode=true ;;
                src/*|tools/*|build.zig|build.zig.zon|zig-analyzer.default.zon) zig=true ;;
                # Every editor checks its release key against the repository's
                minisign.pub) vscode=true; zed=true; nvim=true; vim=true; emacs=true ;;
                # The VS Code, Neovim, Vim, and Emacs tests open a copy of the shared test project
                editors/test-project/*) vscode=true; nvim=true; vim=true; emacs=true ;;
                editors/vscode/*) vscode=true ;;
                editors/zed/*) zed=true ;;
                editors/nvim/*) nvim=true ;;
                editors/vim/*) vim=true ;;
                updates/*) updates=true ;;
                editors/emacs/*) emacs=true ;;
                docs/*|assets/*|README*|CHANGELOG.md|LICENSE|AGENTS.md|.agents/*|.claude/*|.gitignore|.github/workflows/mirror.yml) ;;
                # The website has a workflow of its own (website.yml) and nothing here tests it
                website/*|wrangler.jsonc|.github/workflows/website.yml) ;;
                # A path that no rule knows may need anything: run everything, and say so on the
                # pull request so that the path gets a rule
                *)
                  echo "::warning file=.github/workflows/ci.yml,title=No CI path rule::$path matches no rule in the Changed paths job, so every job runs; add a rule for it"
                  all
                  full=true
                  ;;
              esac
            done < "$changed"
          fi

          # A pull request runs the fast matrix. It runs the whole suite (including the tests that
          # start a real zig) in Debug on Linux and on Windows, whose paths, URIs, and process
          # starts the end-to-end tests cover, and only the tests that need no external tools on
          # macOS, where a project load and a zig start are the slowest and most of the suite's
          # duration is in end-to-end tests. The build job checks every system,
          # but compiles the tools only on Linux. A push to main, a release, and a change to CI
          # itself run every combination. Shards of the test suite run in parallel in one job
          # (see `-Dtest-shards`), so a job is as long as its longest shard, not as long as the
          # whole suite.
          shards=4
          if [ "$full" = true ]; then
            test_matrix='{"include":[
              {"os":"ubuntu-latest","zig":"0.17.0","optimize":"Debug","suite":"test-all","shards":'"$shards"'},
              {"os":"ubuntu-latest","zig":"0.17.0","optimize":"ReleaseSafe","suite":"test-all","shards":'"$shards"'},
              {"os":"ubuntu-latest","zig":"0.17.1","optimize":"Debug","suite":"test-all","shards":'"$shards"'},
              {"os":"ubuntu-latest","zig":"0.17.1","optimize":"ReleaseSafe","suite":"test-all","shards":'"$shards"'},
              {"os":"macos-latest","zig":"0.17.0","optimize":"ReleaseSafe","suite":"test-all","shards":'"$shards"'},
              {"os":"macos-latest","zig":"0.17.1","optimize":"Debug","suite":"test-all","shards":'"$shards"'},
              {"os":"macos-latest","zig":"0.17.1","optimize":"ReleaseSafe","suite":"test-all","shards":'"$shards"'},
              {"os":"windows-latest","zig":"0.17.0","optimize":"ReleaseSafe","suite":"test-all","shards":'"$shards"'},
              {"os":"windows-latest","zig":"0.17.1","optimize":"Debug","suite":"test-all","shards":'"$shards"'},
              {"os":"windows-latest","zig":"0.17.1","optimize":"ReleaseSafe","suite":"test-all","shards":'"$shards"'}
            ]}'
            build_matrix='{"include":[
              {"os":"ubuntu-latest","zig":"0.17.0","check":true},
              {"os":"ubuntu-latest","zig":"0.17.1","check":true},
              {"os":"macos-latest","zig":"0.17.1","check":true},
              {"os":"windows-latest","zig":"0.17.1","check":true}
            ]}'
            corpus_matrix='{"include":[{"os":"ubuntu-latest","zig":"0.17.0"},{"os":"ubuntu-latest","zig":"0.17.1"}]}'
            fuzz_runs=50K
          else
            test_matrix='{"include":[
              {"os":"ubuntu-latest","zig":"0.17.0","optimize":"Debug","suite":"test-all","shards":'"$shards"'},
              {"os":"ubuntu-latest","zig":"0.17.1","optimize":"Debug","suite":"test-all","shards":'"$shards"'},
              {"os":"macos-latest","zig":"0.17.1","optimize":"Debug","suite":"test","shards":'"$shards"'},
              {"os":"windows-latest","zig":"0.17.1","optimize":"Debug","suite":"test-all","shards":'"$shards"'}
            ]}'
            build_matrix='{"include":[
              {"os":"ubuntu-latest","zig":"0.17.1","check":true},
              {"os":"macos-latest","zig":"0.17.1","check":false},
              {"os":"windows-latest","zig":"0.17.1","check":false}
            ]}'
            corpus_matrix='{"include":[{"os":"ubuntu-latest","zig":"0.17.1"}]}'
            fuzz_runs=10K
          fi
          # The matrices are single lines for GITHUB_OUTPUT
          test_matrix=$(printf '%s' "$test_matrix" | tr -d '\n')
          build_matrix=$(printf '%s' "$build_matrix" | tr -d '\n')
          corpus_matrix=$(printf '%s' "$corpus_matrix" | tr -d '\n')

          printf 'Jobs: full=%s zig=%s vscode=%s zed=%s nvim=%s vim=%s updates=%s emacs=%s\n' "$full" "$zig" "$vscode" "$zed" "$nvim" "$vim" "$updates" "$emacs"
          printf 'Test matrix: %s\n' "$test_matrix"
          printf 'Build matrix: %s\n' "$build_matrix"
          printf 'Corpus matrix: %s\n' "$corpus_matrix"
          printf 'Fuzz runs: %s\n' "$fuzz_runs"
          {
            printf 'zig=%s\n' "$zig"
            printf 'vscode=%s\n' "$vscode"
            printf 'zed=%s\n' "$zed"
            printf 'nvim=%s\n' "$nvim"
            printf 'vim=%s\n' "$vim"
            printf 'updates=%s\n' "$updates"
            printf 'emacs=%s\n' "$emacs"
            printf 'test-matrix=%s\n' "$test_matrix"
            printf 'build-matrix=%s\n' "$build_matrix"
            printf 'corpus-matrix=%s\n' "$corpus_matrix"
            printf 'fuzz-runs=%s\n' "$fuzz_runs"
          } >> "$GITHUB_OUTPUT"

  updates:
    name: Update check
    needs: changes
    if: needs.changes.outputs.updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The metadata generator
        run: node updates/test/metadata.test.mjs
      - name: The Worker routes
        run: node updates/test/worker.test.mjs
      - name: The Worker bundles
        run: npx --yes wrangler@4.163.0 deploy --dry-run --config updates/wrangler.jsonc

  test:
    name: Test (${{ matrix.os }}, Zig ${{ matrix.zig }}, ${{ matrix.optimize }})
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ matrix.zig }}
          cache-key: test-${{ matrix.optimize }}
      # The tests run zig without the cache directory overrides of setup-zig (see
      # `runAnalyzerTests` in build.zig), so the fixture builds use the default global cache
      # directory; without it, each shard first compiles what every build links (compiler_rt and
      # the like). Its content depends only on the zig version and the system, so the key does
      # not change with the commit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.suite == 'test-all'
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/zig' || '~/.cache/zig' }}
          key: fixture-zig-cache-v1-${{ matrix.os }}-${{ matrix.zig }}-${{ matrix.optimize }}
      - name: zig build ${{ matrix.suite }} (in ${{ matrix.shards }} shards)
        run: zig build ${{ matrix.suite }} -Doptimize=${{ matrix.optimize }} -Dtest-shards=${{ matrix.shards }} --summary all

  build:
    name: Build (${{ matrix.os }}, Zig ${{ matrix.zig }})
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ matrix.zig }}
          cache-key: build
      - name: Build the executable
        run: zig build -Doptimize=ReleaseSafe
      - name: Compile check (including the tools)
        if: matrix.check
        run: zig build check -Doptimize=ReleaseSafe

  corpus:
    name: Corpus cross-check (${{ matrix.os }}, Zig ${{ matrix.zig }})
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.corpus-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ matrix.zig }}
          cache-key: corpus
      - name: Corpus cross-check (Zig standard library + this repository's sources and .zon files)
        run: zig build corpus -Doptimize=ReleaseSafe -- src tools build.zig.zon zig-analyzer.default.zon

  lint:
    name: Formatting and generated code
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        run: zig fmt --check src tools build.zig
      - name: Generated code matches the committed files
        run: |
          zig build gen
          git diff --exit-code -- src/lsp/types.zig src/ide/builtin_data.zig src/ide/manifest_data.zig
      - name: The Windows build imports only functions Windows 10 1507 has
        run: zig build check -Dtarget=x86_64-windows

  fuzz:
    name: Coverage-guided fuzzing
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # Use ReleaseSafe: Debug builds on Linux x86_64 use the self-hosted backend by default, which
      # does not support coverage instrumentation (pcs_len in the coverage file is 0); ReleaseSafe
      # uses LLVM and also has higher throughput. A pull request runs 10K runs per fuzz target;
      # main and releases run 50K.
      - name: zig build test --fuzz
        run: zig build test -Doptimize=ReleaseSafe --fuzz=${{ needs.changes.outputs.fuzz-runs }}

  vscode:
    name: VS Code extension
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ZIG_ANALYZER: ${{ github.workspace }}/zig-out/bin/zig-analyzer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: vscode
      # The smoke test opens editors/test-project, which the server loads with the zig in PATH
      - name: Build the server
        run: zig build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run typecheck
          npm run check-settings
          xvfb-run -a npm test

  zed:
    name: Zed extension
    needs: changes
    if: needs.changes.outputs.zed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Zed extension
        working-directory: editors/zed
        run: |
          rustup target add wasm32-wasip2
          cargo test
          cargo build --release --target wasm32-wasip2

  nvim:
    name: Neovim plugin
    needs: changes
    if: needs.changes.outputs.nvim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ZIG_ANALYZER: ${{ github.workspace }}/zig-out/bin/zig-analyzer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: nvim
      # The smoke test opens editors/test-project, which the server loads with the zig in PATH
      - name: Build the server
        run: zig build
      # The install test signs its fake releases with Node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Neovim plugin
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          XDG_STATE_HOME="$RUNNER_TEMP/nvim-state" "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless --clean -u NONE -l editors/nvim/test/smoke.lua
          XDG_DATA_HOME="$RUNNER_TEMP/nvim-install-data" XDG_STATE_HOME="$RUNNER_TEMP/nvim-install-state" "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless --clean -u NONE -l editors/nvim/test/install.lua
          XDG_STATE_HOME="$RUNNER_TEMP/nvim-update-state" "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless --clean -u NONE -l editors/nvim/test/update.lua

  vim:
    name: Vim plugin (yegappan/lsp and vim-lsp)
    needs: changes
    if: needs.changes.outputs.vim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ZIG_ANALYZER: ${{ github.workspace }}/zig-out/bin/zig-analyzer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: vim
      # The smoke test opens editors/test-project, which the server loads with the zig in PATH
      - name: Build the server
        run: zig build
      # The install test signs its fake releases with Node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # yegappan/lsp needs a newer Vim than Ubuntu's (9.1.0016): build the version the tests were
      # written with
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        id: vim
        with:
          version: v9.2.1178
      - name: Vim plugin (yegappan/lsp and vim-lsp)
        # Not `VIM`: Vim reads it as the directory of its runtime files
        env:
          VIM_EXE: ${{ steps.vim.outputs.executable }}
        run: |
          "$VIM_EXE" --version | head -n 2
          # test/install.vim checks the signatures of its fake releases with minisign
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q minisign > /dev/null
          clone() { git init -q "$2" && git -C "$2" fetch -q --depth 1 "$1" "$3" && git -C "$2" checkout -q FETCH_HEAD; }
          clone https://github.com/yegappan/lsp "$RUNNER_TEMP/yegappan-lsp" c741b2f1afb42b9f267824dac4049674908f4a41
          clone https://github.com/prabirshrestha/vim-lsp "$RUNNER_TEMP/vim-lsp" 977e704cdbbbbc89a54f8f226d3468b0aa0405c9
          status=0
          for client in yegappan vimlsp; do
            dir="$RUNNER_TEMP/yegappan-lsp"; [ "$client" = vimlsp ] && dir="$RUNNER_TEMP/vim-lsp"
            ZA_CLIENT=$client ZA_CLIENT_DIR="$dir" ZA_RESULT="$RUNNER_TEMP/vim-$client.txt" \
              timeout 600 "$VIM_EXE" -N -u NONE -i NONE --not-a-term -S editors/vim/test/smoke.vim > /dev/null || status=1
            cat "$RUNNER_TEMP/vim-$client.txt" || status=1
            ZA_CLIENT=$client ZA_CLIENT_DIR="$dir" ZA_RESULT="$RUNNER_TEMP/vim-install-$client.txt" \
              timeout 600 "$VIM_EXE" -N -u NONE -i NONE --not-a-term -S editors/vim/test/install.vim > /dev/null || status=1
            cat "$RUNNER_TEMP/vim-install-$client.txt" || status=1
          done
          ZA_RESULT="$RUNNER_TEMP/vim-update.txt" timeout 60 "$VIM_EXE" -N -u NONE -i NONE --not-a-term -S editors/vim/test/update.vim > /dev/null || status=1
          cat "$RUNNER_TEMP/vim-update.txt" || status=1
          exit $status

  emacs:
    name: Emacs package
    needs: changes
    if: needs.changes.outputs.emacs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ZIG_ANALYZER: ${{ github.workspace }}/zig-out/bin/zig-analyzer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: emacs
      # The smoke test opens editors/test-project, which the server loads with the zig in PATH
      - name: Build the server
        run: zig build
      - name: Install Emacs and minisign
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q emacs-nox minisign
          emacs --version | head -n 1
      # The install test signs its fake releases with Node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Emacs package
        working-directory: editors/emacs
        run: |
          emacs -Q --batch -L . -l test/zig-analyzer-test.el -f ert-run-tests-batch-and-exit
          emacs -Q --batch -L . -l test/install.el
          timeout 900 emacs -Q --batch -L . -l test/smoke.el
