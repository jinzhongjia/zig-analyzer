name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.1

jobs:
  test:
    name: Test (${{ matrix.os }}, Zig ${{ matrix.zig }}, ${{ matrix.optimize }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: [0.17.0, 0.17.1]
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          cache-key: test-${{ matrix.optimize }}
      - name: All tests
        run: zig build test-all -Doptimize=${{ matrix.optimize }} --summary all

  build:
    name: Build (${{ matrix.os }}, Zig ${{ matrix.zig }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: [0.17.0, 0.17.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          cache-key: build
      - name: Build the executable
        run: zig build -Doptimize=ReleaseSafe
      - name: Compile check (including the tools)
        run: zig build check -Doptimize=ReleaseSafe

  corpus:
    name: Corpus cross-check (${{ matrix.os }}, Zig ${{ matrix.zig }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: [0.17.0, 0.17.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          cache-key: corpus
      - name: Corpus cross-check (Zig standard library + this repository's sources and .zon files)
        run: zig build corpus -Doptimize=ReleaseSafe -- src tools build.zig.zon zig-analyzer.default.zon

  lint:
    name: Formatting and generated code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        run: zig fmt --check src tools build.zig
      - name: Generated code matches the committed files
        run: |
          zig build gen
          git diff --exit-code -- src/lsp/types.zig src/ide/builtin_data.zig src/ide/manifest_data.zig
      - name: The Windows build imports only functions Windows 10 1507 has
        run: zig build check -Dtarget=x86_64-windows

  fuzz:
    name: Coverage-guided fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Use ReleaseSafe: Debug builds on Linux x86_64 use the self-hosted backend by default, which
      # does not support coverage instrumentation (pcs_len in the coverage file is 0); ReleaseSafe
      # uses LLVM and also has higher throughput. 50K runs per fuzz target.
      - name: zig build test --fuzz
        run: zig build test -Doptimize=ReleaseSafe --fuzz=50K
