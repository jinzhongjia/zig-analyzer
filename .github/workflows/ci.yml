name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: All tests (Debug)
        run: zig build test-all --summary all
      - name: All tests (ReleaseSafe)
        run: zig build test-all -Doptimize=ReleaseSafe --summary all
      - name: Build the executable
        run: zig build -Doptimize=ReleaseSafe
      - name: Compile check (including benchmark tools)
        run: zig build check -Doptimize=ReleaseSafe
      - name: Corpus cross-check (Zig standard library + this repository's sources)
        run: zig build corpus -Doptimize=ReleaseSafe -- src tools

  lint:
    name: Formatting and generated code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        run: zig fmt --check src tools build.zig
      - name: Generated code matches the committed files
        run: |
          zig build gen
          git diff --exit-code -- src/lsp/types.zig src/ide/builtin_data.zig

  fuzz:
    name: Coverage-guided fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Use ReleaseSafe: Debug builds on Linux x86_64 use the self-hosted backend by default, which
      # does not support coverage instrumentation (pcs_len in the coverage file is 0); ReleaseSafe
      # uses LLVM and also has higher throughput. 50K runs per fuzz target.
      - name: zig build test --fuzz
        run: zig build test -Doptimize=ReleaseSafe --fuzz=50K
